<div class="view-header">
  <div class="header-container">
    <!-- Title Row -->
    <div class="header-row" *ngIf="title">
      <div class="title-section d-flex align-items-center">
        <h1 class="mb-0 me-3">{{ title }}</h1>

        <!-- Share button (for public crates) -->
        <button class="btn btn-sm text-light"
                *ngIf="showShare"
                (click)="onShare()"
                title="Share Crate">
          <i class="bi-box-arrow-up-right"></i>
        </button>

        <!-- Settings button (for individual crates) -->
        <button class="btn btn-sm text-light"
                *ngIf="showSettings"
                (click)="onSettings()"
                title="Settings">
          <i class="bi-gear"></i>
        </button>
      </div>

      <!-- Auto-Categorize button (for crates) -->
      <div class="action-buttons" *ngIf="showAutoCategorize || showSyncButton">
        <button class="btn btn-sm btn-primary auto-categorize-button me-2"
                *ngIf="showAutoCategorize"
                (click)="onAutoCategorize()"
                title="Auto-Organize Library">
          <i class="bi-stars me-1"></i>
          <span>Auto-Organize</span>
        </button>

        <!-- Sync button (for library) -->
        <button class="btn sync-button"
                *ngIf="showSyncButton"
                [class.syncing]="syncLoading"
                [disabled]="syncDisabled || syncLoading"
                (click)="onSync()"
                title="Sync">
          <i class="bi-arrow-clockwise"></i>
        </button>
      </div>
    </div>

    <!-- Description Row -->
    <div class="description-row" *ngIf="description">
      <p class="mb-0 text-muted">{{ description }}</p>
    </div>

    <!-- Author Row -->
    <div class="author-row" *ngIf="showAuthor && authorName">
      <p class="mb-0 text-muted">
        by
        <button class="btn btn-link p-0 text-primary fw-semibold"
                (click)="onAuthorClick()"
                [disabled]="!authorId"
                style="vertical-align: baseline; font-size: inherit;">
          {{ authorName }}
        </button>
      </p>
    </div>

    <!-- Search and Controls Row -->
    <div class="search-controls-row align-items-center" *ngIf="showSearch || showListToggle">
      <div class="search-section" *ngIf="showSearch">
        <crates-searchbar
          [placeholder]="searchPlaceholder"
          (search)="onSearch($event)">
        </crates-searchbar>
      </div>
      <div class="toggle-section" *ngIf="showSort || showListToggle">
        <div class="d-flex align-items-center justify-content-end gap-1">
          <crates-sort-toggle
            *ngIf="showSort"
            [sort]="sort"
            (sortChange)="onSortChange($event)">
          </crates-sort-toggle>
          <crates-list-type-toggle
            *ngIf="showListToggle"
            [listType]="listType"
            (toggle)="onListTypeToggle($event)">
          </crates-list-type-toggle>
        </div>
      </div>
    </div>

    <!-- Filter Section -->
    <div class="filter-row" *ngIf="showFilters">
      <div class="filter-section">
        <div class="form-check form-switch">
          <input class="form-check-input"
                 type="checkbox"
                 role="switch"
                 id="hideCratedFilter"
                 [checked]="hideCrated"
                 (change)="onFilterChange($event)">
          <label class="form-check-label" for="hideCratedFilter">{{ hideCratedLabel }}</label>
        </div>
      </div>
    </div>
  </div>
</div>
